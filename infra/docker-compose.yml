# docker-compose.yml — entorno de desarrollo de NaviCash
# ---------------------------------------------------------------------------
# Levanta los 4 servicios contenerizados:
#   1. db    : PostgreSQL 17 (base de datos)
#   2. redis : Redis 7 (caché compartida: rate limits + confirmaciones)
#   3. api   : Django + DRF (backend REST)
#   4. web   : Vite + React + TS (frontend con proxy hacia la API)
#
# Uso:
#   cp .env.example .env
#   docker compose -f infra/docker-compose.yml up --build
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:17
    container_name: navicash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navicash}
      POSTGRES_USER: ${POSTGRES_USER:-navicash}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navicash-dev-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # AUDIT M7: el puerto se publica SOLO en loopback para debug local con
    # herramientas del host; ningún servicio del proyecto entra por host
    # (la API usa la red interna: POSTGRES_HOST=db). En la red real no está
    # expuesto.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-navicash} -d ${POSTGRES_DB:-navicash}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # AUDIT C2: caché compartida del backend (throttle del asistente y
  # transferencias pendientes de confirmación). Interna a la red del compose:
  # sin puertos al host (descomenta el bind 127.0.0.1 para debug con redis-cli).
  redis:
    image: redis:7-alpine
    container_name: navicash-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # ports:
    #   - "127.0.0.1:6379:6379"

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: navicash-api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py refresh_rates &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../.env
    environment:
      DJANGO_DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Caché compartida (valor SOLO de desarrollo; en prod el fail-fast de
      # settings.py exige una REDIS_URL real).
      REDIS_URL: redis://redis:6379/0
      # Valores explícitos SOLO de desarrollo (nunca para producción; ahí el
      # fail-fast de settings.py impide arrancar con estos placeholders).
      DEBUG: ${DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key-cambiar-en-produccion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-navicash-dev-password}
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-True}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - ../services/api:/app          # código en vivo para desarrollo
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    container_name: navicash-web
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    env_file:
      - ../.env
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ../apps/web:/app               # código en vivo
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules: