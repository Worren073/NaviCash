name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt

      - name: Lint with ruff
        run: ruff check services/api/apps/ --select F --ignore F821 --exclude "*/migrations/*"

      - name: Run tests
        run: cd services/api && python -m pytest

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r services/api/requirements.txt

  audit-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: cd apps/web && npm ci

      - name: Lint
        run: cd apps/web && npm run lint

      - name: Typecheck
        run: cd apps/web && npm run typecheck

      - name: Build
        run: cd apps/web && npm run build
        # El build es fail-closed sin VITE_CAPTCHA_SITE_KEY (hallazgo M8). Se usa
        # la clave pública de prueba de Turnstile: en producción la real llega
        # por .env, nunca se hardcodea el SECRET key en el repo.
        env:
          VITE_CAPTCHA_SITE_KEY: 1x00000000000000000000AA

      - name: Audit npm dependencies
        run: cd apps/web && npm audit --audit-level=high
