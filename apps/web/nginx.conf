# nginx.conf — Configuración de producción para la PWA de NaviCash.
# ---------------------------------------------------------------------------
# Sirve el build estático (dist/) con:
#   - Headers de seguridad (CSP, X-Frame-Options, Referrer-Policy, HSTS, ...)
#     que Render Static Site no permite emitir (AUDIT frontend).
#   - Fallback SPA: cualquier ruta del router devuelve index.html.
#   - Caché larga solo para assets hasheados; nunca para index.html ni el
#     service worker (para que la actualización de la PWA fluya).
#
# API SAME-ORIGIN (audítalo si tocas esto):
#   nginx hace proxy de /api al servicio de la API, así la SPA y la API
#   comparten origen. Esto NO es cosmético: con la API en otro subdominio de
#   *.onrender.com, la cookie httpOnly del refresh era THIRD-PARTY
#   (onrender.com está en la Public Suffix List, luego cada subdominio es un
#   "sitio" distinto) y Chrome 1xx / Safari-iOS dejaron de guardarla: la
#   sesión moría a los 15 min con REFRESH_REJECTED reason=no_cookie.
#   En mismo origen la cookie es first-party y no depende de esas políticas.
#   Requisito: construir la SPA con VITE_API_URL=/api.
#
# NOTA CSP: connect-src mantiene https: para no romper nada si alguien despliega
# la SPA con una API cross-origin, aunque el flujo soportado sea same-origin.
# Turnstile (CAPTCHA) y Google Fonts se permiten explícitamente.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Cabeceras de seguridad (en todas las respuestas) ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---------- Caché por tipo de recurso ----------

    # Assets con hash de Vite (dist/assets/*): inmutables, caché máxima.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # Service worker de la PWA: nunca cachear (la actualización se propaga).
    location ~* ^/(sw\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # index.html: no cachear (siempre la versión más reciente).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https:; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # ---------- API same-origin (proxy al servicio Django) ----------
    # La SPA se construye con VITE_API_URL=/api y habla con /api/... en su
    # propio origen: la cookie httpOnly del refresh queda first-party y el
    # navegador la guarda (ver cabecera del archivo).
    location /api/ {
        # SIN barra final a propósito: se conserva el /api/ de la ruta para
        # que el Django siga viendo /api/auth/refresh, /api/business/..., etc.
        proxy_pass https://navicash-api-t7vk.onrender.com;

        proxy_http_version 1.1;
        # Host del API: así Django valida contra DJANGO_ALLOWED_HOSTS y su
        # chequeo de Origin del refresh sigue teniendo referencia.
        proxy_set_header Host navicash-api-t7vk.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin y Referer se reenvían tal cual (defensa CSRF del refresh).

        # Sin buffer ni caché: el asistente puede hacer streaming de audio y
        # el login/refresh son respuestas cortas que nunca deben cachearse.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;

        # Render/Cloudflare exige TLS 1.2+ y SNI. Sin estas líneas el handshake
        # falla con "ssl/tls alert handshake failure (alert 40)" y el proxy
        # responde 502 en TODAS las peticiones a /api. (nginx -t no lo detecta:
        # solo se ve al hacer la petición real contra el upstream.)
        proxy_ssl_server_name on;
        proxy_ssl_name navicash-api-t7vk.onrender.com;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # El default de nginx es 1m y la API acepta 12 MB (clips de voz del
        # asistente). Sin esto las subidas fallarían con 413.
        client_max_body_size 12m;
    }

    # ---------- SPA fallback: cualquier otra ruta devuelve index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
