<!DOCTYPE html>

                      "on-primary": "#ffffff",

                      "surface-variant": "#e1e7e4",
                      "on-background": "#191f31",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#ffdbce",
                      "surface-container-lowest": "#ffffff",
                      "status-warning": "#FBBF24",
                      "tertiary": "#8d4a2a",
                      "tertiary-container": "#ffd5c3",
                      "on-error-container": "#410002",
                      "surface-bright": "#ffffff",
                      "expense": "#FB7185",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#414947",
                      "surface-container-low": "#f6f8fb",
                      "error": "#ba1a1a",
                      "outline-variant": "#bfc9c6",
                      "inverse-surface": "#2e3447",
                      "surface-tint": "#006a61",
                      "on-primary-container": "#00201d",
                      "on-tertiary-fixed": "#370e00",
                      "surface": "#ffffff",
                      "tertiary-fixed-dim": "#ffb59a",
                      "surface-container-high": "#e6eaf3",
                      "primary-fixed-dim": "#6bd8cb",
                      "income": "#4ADE80",
                      "on-secondary": "#ffffff",
                      "status-delayed": "#F43F5E",
                      "on-secondary-fixed": "#111c2d",
                      "status-pending": "#FB7185",
                      "on-primary-fixed": "#00201d",
                      "surface-container": "#edf1fa",
                      "on-primary-fixed-variant": "#005049",
                      "glass-border": "rgba(0, 0, 0, 0.08)",
                      "on-secondary-fixed-variant": "#3c475a",

                      "surface-container-highest": "#e0e4ed",

                      "outline": "#717977",

                      "on-secondary-container": "#131d2f",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",

              "spacing": {

                      "numeric-display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

<style>
        body {
            font-family: 'Geist', sans-serif;
            background: #ffffff;
            color: #191f31;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Mock Dashboard Background Blur */
        .dashboard-mock-bg {
            position: fixed;
            inset: 0;
            background: #f6f8fb;
            z-index: -1;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%);
            border-radius: inherit;
        }

        .input-ghost {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
        }
        
        .input-ghost:focus {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 0.5rem;
        }

        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .glow-button {
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glow-button::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0, 106, 97, 0.2) 0%, transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.5s ease-out;
            border-radius: 50%;
            pointer-events: none;
        }
        .glow-button:active {
            transform: scale(0.98);
        }
        .glow-button:active::after {
            transform: translate(-50%, -50%) scale(2);
            transition: 0s;
        }

        /* Toggle Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #006a61;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #006a61;
        }
        
        /* Currency Toggle */
        .currency-toggle-active {
            background-color: #006a61;
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0, 106, 97, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="antialiased relative bg-background">
<!-- Blurred Dashboard Background -->
<div class="dashboard-mock-bg" data-alt="A blurred, light-themed financial dashboard interface showing abstract charts and transaction lists in teal and white tones, creating a sense of depth and security in a glassmorphic style."></div>
<!-- Full Screen Modal Container -->
<main class="fixed inset-0 z-50 flex flex-col h-full w-full bg-background/95 backdrop-blur-3xl">
<!-- Header -->
<header class="flex justify-between items-center px-container-padding py-4 w-full relative z-10 shrink-0">
<button aria-label="Close" class="text-on-surface-variant hover:text-on-surface transition-colors p-2 -ml-2 rounded-full active:bg-black/5">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-semibold tracking-tight absolute left-1/2 -translate-x-1/2">Add Operation</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Form Scrollable Area -->
<div class="flex-1 overflow-y-auto px-container-padding pb-[120px] pt-4 flex flex-col gap-6">
<!-- Amount & Currency Section -->
<section class="glass-panel rounded-[2rem] p-8 flex flex-col items-center justify-center gap-6 relative overflow-hidden">
<!-- Decorative Glow behind amount -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-32 h-32 bg-primary/5 rounded-full blur-3xl pointer-events-none"></div>
<!-- Currency Toggle -->
<div class="flex bg-surface-container-highest rounded-full p-1 border border-glass-border relative z-10">
<button class="px-6 py-2 rounded-full font-label-md text-label-md transition-all currency-toggle-active" onclick="toggleCurrency(this, 'VES')" type="button">USD</button>
<button class="px-6 py-2 rounded-full font-label-md text-label-md text-on-surface-variant transition-all" onclick="toggleCurrency(this, 'USD')" type="button">VES</button>
</div>
<!-- Amount Input -->
<div class="flex items-baseline justify-center w-full relative z-10">
<span class="font-numeric-display text-numeric-display text-primary mr-2 select-none">$</span>
<input autofocus="" class="input-ghost font-numeric-display text-numeric-display text-on-surface w-full max-w-[200px]" placeholder="0.00" type="number" value="0.00"/>
</div>
</section>
<!-- Details Section -->
<section class="glass-panel rounded-xl p-4 flex flex-col gap-stack-tight">
<!-- Concept -->
<div class="flex items-center gap-4 py-3 border-b border-glass-border">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="edit_note">edit_note</span>
</div>
<input class="bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant w-full focus:ring-0" placeholder="Concept (e.g., Groceries)" type="text"/>
</div>
<!-- Category -->
<div class="flex items-center gap-4 py-3 border-b border-glass-border">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-tertiary" data-icon="category">category</span>
</div>
<div class="flex-1 flex overflow-x-auto gap-2 pb-1 scrollbar-hide snap-x">
<!-- Category Chips -->
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-primary/10 border border-primary/20 font-label-sm text-label-sm text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="restaurant">restaurant</span> Food
                        </button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-surface-container border border-glass-border font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="directions_car">directions_car</span> Transport
                        </button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-surface-container border border-glass-border font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="shopping_bag">shopping_bag</span> Shopping
                        </button>
<button class="snap-start shrink-0 px-4 py-2 rounded-full bg-surface-container border border-glass-border font-label-sm text-label-sm text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="add">add</span> More
                        </button>
</div>
</div>
<!-- Contact -->
<div class="flex items-center gap-4 py-3">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary" data-icon="person">person</span>
</div>
<input class="bg-transparent border-none outline-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant w-full focus:ring-0" placeholder="Contact (Optional)" type="text"/>
<button class="text-primary p-2">
<span class="material-symbols-outlined" data-icon="contacts">contacts</span>
</button>
</div>
</section>
<!-- Remind Me Toggle -->
<section class="glass-panel rounded-xl p-4 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-status-warning text-[18px]" data-icon="notifications_active">notifications_active</span>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface">Remind me</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Set a notification for this</p>
</div>
</div>
<!-- Toggle Switch UI -->
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-container-highest appearance-none cursor-pointer z-10 transition-all duration-300 left-0 checked:left-6" id="toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container-highest cursor-pointer transition-colors duration-300" for="toggle"></label>
</div>
</section>
</div>
<!-- Fixed Bottom Action -->
<footer class="fixed bottom-0 left-0 right-0 p-container-padding bg-gradient-to-t from-background via-background/90 to-transparent pt-12 pb-6 z-20">
<button class="glow-button w-full py-4 rounded-xl bg-primary text-on-primary font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-[0_4_14px_rgba(0,106,97,0.2)] hover:shadow-[0_6_20px_rgba(0,106,97,0.3)] transition-shadow">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                Registrar
            </button>
</footer>
</main>
<script>
        function toggleCurrency(btn, other) {
            const siblings = btn.parentElement.children;
            for(let i=0; i<siblings.length; i++) {
                siblings[i].classList.remove('currency-toggle-active', 'text-on-primary');
                siblings[i].classList.add('text-on-surface-variant');
            }
            btn.classList.add('currency-toggle-active', 'text-on-primary');
            btn.classList.remove('text-on-surface-variant');
            
            // Update symbol
            const symbolSpan = document.querySelector('.font-numeric-display.text-primary');
            if(btn.innerText === 'USD') {
                symbolSpan.innerText = '$';
            } else {
                symbolSpan.innerText = 'Bs.';
            }
        }
    </script>
</body></html>
