# Configuración de pytest para NaviCash.
# - Django: usamos settings de tests (heredan de la base pero fuerzan SQLite
#   en memoria y proveedor de tasas estático para no tocar red/Postgres).
# - Filtros por defecto para evitar que pytest recoja el proyecto completo.
[pytest]
DJANGO_SETTINGS_MODULE = config.test_settings
django_debug_mode = keep
python_files = test_*.py
addopts = -q --tb=short
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning