# render.yaml — Blueprint de Render para NaviCash (despliegue "todo en Render").
# -----------------------------------------------------------------------------
# Crea de una vez: Web Service (API Django) + Static Site (frontend PWA) +
# Render Postgres + Render Key Value (Redis).
#
# - Con `rootDir`, todos los paths y comandos son RELATIVOS a esa raíz
#   (dockerfilePath, dockerContext, staticPublishPath, buildCommand, startCommand).
# - Los valores con `sync: false` se piden en el dashboard al crear el Blueprint.
# -----------------------------------------------------------------------------

databases:
  # Render Postgres: los campos `type`/`version` NO existen aquí.
  # El tipo se infiere; la versión se fija con `postgresMajorVersion`.
  - name: navicash-db
    databaseName: navicash
    user: navicash
    plan: free
    postgresMajorVersion: "17"

services:
  # ============================ API (Django, Docker) ========================
  - name: navicash-api
    type: web
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      # Conexión a Postgres: URL completa resuelta por el Blueprint al sync
      # (URL interna; la API y la BD comparten región/workspace en Oregon). Un
      # solo valor evita que host/puerto/usuario/contraseña queden
      # desincronizados (AUDIT A2/M7). El secreto nunca viaja en el YAML.
      - key: DATABASE_URL
        fromDatabase:
          name: navicash-db
          property: connectionString
      # Red privada de Render: la URL interna no exige TLS, por eso "prefer".
      # Si se usa la URL externa (dev/CI), llevar ?sslmode=require o cambiar
      # este valor a "require".
      - key: DJANGO_DB_SSLMODE
        value: prefer
      - key: REDIS_URL
        fromService:
          name: navicash-redis
          type: keyvalue
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # SameSite de la cookie httpOnly del refresh. Con la API servida en el
      # MISMO origen (nginx hace proxy de /api en el servicio web) la cookie es
      # first-party: pon "Lax". Déjalo en "None" solo si despliegas la SPA en
      # otro dominio (cookie third-party, sujeta a que el navegador la guarde).
      - key: JWT_COOKIE_SAMESITE
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CAPTCHA_ENABLED
        value: "True"
      - key: CAPTCHA_DEV_BYPASS
        value: "False"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: "navicashvnz@gmail.com"
      - key: BREVO_SENDER_NAME
        value: "NaviCash"
      - key: DEFAULT_FROM_EMAIL
        value: "NaviCash <navicashvnz@gmail.com>"
      - key: EMAIL_TIMEOUT
        value: "10"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "True"
      - key: RATE_PROVIDER
        value: dolarapi
      - key: RATE_TTL_MINUTES
        value: "60"
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "30"
      - key: VERIFICATION_TOKEN_HOURS
        value: "24"
      - key: TERMS_VERSION
        value: v1-2026-08
      # Voz (chat de Navi): sin AAI_API_KEY se usa la transcripción Mock
      # (frase fija para dev). Con clave se transcribe con el mismo proveedor
      # del chat: Gemini (generateContent nativo) si la base es
      # generativelanguage, o Whisper si el proveedor es OpenAI/Groq.
      - key: AAI_API_KEY
        sync: false
      # Web Push (VAPID): generar UNA vez con
      # `python manage.py generate_vapid_keys` y pegar los valores aquí.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: "mailto:navicashvnz@gmail.com"
      # Token compartido con el cron horario de GitHub Actions
      # (.github/workflows/reminders.yml) para POST /api/internal/tick.
      # Debe coincidir con el secret INTERNAL_TOKEN del repo en GitHub.
      - key: INTERNAL_TOKEN
        sync: false
      # Clave maestra (Fernet, base64 urlsafe de 32 bytes) para cifrar los
      # secretos por negocio de la WhatsApp Cloud API (apps/core/crypto.py).
      # Generar con:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      # Instagram Messaging (Instagram Login): app de Meta con el producto
      # "Instagram" y permisos instagram_business_basic +
      # instagram_business_manage_messages. El redirect URI y el webhook se
      # registran en el panel de la app.
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: INSTAGRAM_VERIFY_TOKEN
        sync: false
      - key: INSTAGRAM_API_BASE_URL
        value: https://graph.instagram.com/v21.0
      # Adjuntos de chat: object storage S3/R2 (bucket público o dominio CDN).
      - key: MEDIA_STORAGE_BACKEND
        value: s3
      - key: MEDIA_URL
        value: /media/
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false

  # ================== Frontend / PWA (Docker + nginx) =======================
  # Render Static Site no permite emitir headers HTTP (CSP, X-Frame-Options,
  # Referrer-Policy, HSTS). Para endurecer la entrega se sirve la PWA desde un
  # contenedor nginx (Dockerfile.prod multi-stage): build de Vite + nginx con
  # las cabeceras de seguridad (AUDIT frontend). VITE_API_URL / VITE_CAPTCHA_
  # SITE_KEY se inyectan como env durante el build (igual que en Static Site).
  - name: navicash-web
    type: web
    runtime: docker
    rootDir: apps/web
    dockerfilePath: Dockerfile.prod
    dockerContext: .
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CAPTCHA_SITE_KEY
        sync: false

  # ===================== Render Key Value (Redis / caché) ====================
  # Key Value se define en `services` (no en `databases`, que es solo Postgres).
  # `ipAllowList` es obligatorio; vacío = solo conexiones internas (la API lo
  # usa por la red privada). `plan: free` es válido para Key Value.
  # NOTA: si Render pidiera tarjeta por este Key Value, sustituirlo por un
  # Redis externo gratuito (Upstash) poniendo REDIS_URL como secreto literal.
  - name: navicash-redis
    type: keyvalue
    ipAllowList: []
    plan: free

  # NOTA: los Cron Jobs se omiten de momento (plan `free` no aplica a cron y
  # arrastrarían costo). Las tasas se refrescan de forma diferida al consultar
  # y los estados "retrasados" se recalculan bajo demanda (R8). Se pueden
  # añadir en una iteración posterior si se acepta el plan de pago.