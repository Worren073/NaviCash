# render.yaml — Blueprint de Render para NaviCash (despliegue "todo en Render").
# -----------------------------------------------------------------------------
# Crea de una vez: Web Service (API Django) + Static Site (frontend PWA) +
# PostgreSQL + Redis + Cron Jobs (tasas y estados "retrasados").
#
# Los valores marcados con `sync: false` son secretos/URLs que debes rellenar
# en el dashboard de Render tras el despliegue (ver docs/STACK.md §5). El
# orden recomendado: crea el Static Site primero para conocer su URL y usarla
# en CORS_ALLOWED_ORIGINS / APP_BASE_URL / VITE_API_URL.
# -----------------------------------------------------------------------------

databases:
  - name: navicash-db
    type: postgres
    databaseName: navicash
    user: navicash
    plan: free
    version: "17"

  - name: navicash-redis
    type: redis
    plan: starter

services:
  # ============================ API (Django) ===============================
  - name: navicash-api
    type: web
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    plan: free
    envVars:
      - key: DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_DB_ENGINE
        value: django.db.backends.postgresql
      - key: POSTGRES_DB
        fromDatabase:
          name: navicash-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: navicash-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: navicash-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: navicash-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: navicash-db
          property: port
      - key: DJANGO_DB_SSLMODE
        value: require
      - key: REDIS_URL
        fromDatabase:
          name: navicash-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: CAPTCHA_ENABLED
        value: "True"
      - key: CAPTCHA_DEV_BYPASS
        value: "False"
      - key: DJANGO_EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: DJANGO_EMAIL_HOST
        value: smtp.resend.com
      - key: DJANGO_EMAIL_PORT
        value: "587"
      - key: DJANGO_EMAIL_HOST_USER
        value: resend
      - key: DJANGO_EMAIL_HOST_PASSWORD
        sync: false
      - key: DJANGO_EMAIL_USE_TLS
        value: "True"
      - key: RATE_PROVIDER
        value: dolarapi
      - key: RATE_TTL_MINUTES
        value: "60"
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "30"
      - key: VERIFICATION_TOKEN_HOURS
        value: "24"
      - key: TERMS_VERSION
        value: v1-2026-08

  # ====================== Frontend / PWA (estático) =========================
  - name: navicash-web
    type: static
    rootDir: apps/web
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CAPTCHA_SITE_KEY
        sync: false

  # ============================ Cron Jobs ===================================
  - name: navicash-cron-rates
    type: cron
    schedule: "0 6 * * *"
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    command: python manage.py refresh_rates
    envVars: &api_env
      - key: DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_DB_ENGINE
        value: django.db.backends.postgresql
      - key: POSTGRES_DB
        fromDatabase:
          name: navicash-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: navicash-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: navicash-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: navicash-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: navicash-db
          property: port
      - key: DJANGO_DB_SSLMODE
        value: require
      - key: REDIS_URL
        fromDatabase:
          name: navicash-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: RATE_PROVIDER
        value: dolarapi
      - key: RATE_TTL_MINUTES
        value: "60"

  - name: navicash-cron-overdue
    type: cron
    schedule: "30 * * * *"
    runtime: docker
    rootDir: services/api
    dockerfilePath: Dockerfile
    command: python manage.py recalc_overdue
    envVars: *api_env
